<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Snooze — Mobile</title>
  <style>
    :root{
      --safe-padding: 16px;
      --gap: 12px;
      --btn-height: 64px;
      --snooze-height: 20vh;
      --radius: 14px;
      --shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    /* Light theme defaults */
    :root{
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #0b1220;
      --snooze-bg: #1db954; /* green */
      --snooze-text: #ffffff;
      --primary-bg: #007bff; /* blue */
      --primary-text: #ffffff;
      --muted: rgba(11,18,32,0.6);
    }

    #debugConsole{
      display:none;
      position:relative;
      z-index:1200;
      width:100%;
      max-width:720px;
      margin:0 auto calc(var(--gap) * 1.25);
      overflow:hidden;
      padding:14px 16px 12px;
      box-sizing:border-box;
      background:rgba(15,18,22,0.92);
      color:#eef3f7;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size:13px;
      line-height:1.4;
      box-shadow:0 16px 40px rgba(0,0,0,0.28);
    }
    #debugConsole.active{ display:block; }
    #debugConsole .debug-title{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; font-size:13px; font-weight:700; }
    #debugConsole .debug-title span{opacity:.78;}
    #debugConsole .debug-log{ max-height:186px; overflow-y:auto; padding-right:6px; }
    #debugConsole .debug-entry{ margin-bottom:6px; white-space:pre-wrap; word-break:break-word; }
    #debugConsole .debug-entry span{ display:inline-block; vertical-align:top; }
    #debugConsole .debug-entry .timestamp{ opacity:.72; margin-right:8px; min-width:120px; }
    #debugConsole .debug-entry .level{ text-transform:uppercase; font-weight:700; margin-right:8px; min-width:58px; }
    #debugConsole .debug-entry .caller{ opacity:.72; margin-right:8px; }
    #debugConsole .debug-entry .message{}
    #debugConsole .debug-entry .level.debug{ color:#9fd4ff; }
    #debugConsole .debug-entry .level.info{ color:#7bffae; }
    #debugConsole .debug-entry .level.warn{ color:#ffd86a; }
    #debugConsole .debug-entry .level.error{ color:#ff6c6c; }

    /* Dark theme overrides */
    @media (prefers-color-scheme: dark){
      :root{
        --bg: #0b0f13;
        --card: #0f1418;
        --text: #eef3f7;
        --snooze-bg: #2ecc71;
        --snooze-text: white;
        --primary-bg: #1e90ff;
        --primary-text: white;
        --muted: rgba(238,243,247,0.7);
        --shadow: none;
      }
      .target-time{ color:rgba(255,255,255,0.80); }
    }

    html,body{
      height:100%;
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, var(--bg), var(--bg));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: calc(var(--safe-padding) * 1.2);
      box-sizing:border-box;
    }

    .shell{
      width:100%;
      max-width:720px;
      background:transparent;
    }

    main.card{
      display:flex;
      flex-direction:column;
      gap:var(--gap);
    }

    header.topbar{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px 0 4px 0;
      color:var(--muted);
      font-size:14px;
    }

    .content{
      display:flex;
      flex-direction:column;
      gap:var(--gap);
    }

    .snooze-wrap{
      width:100%;
      display:flex;
    }

    button.btn{
      -webkit-appearance:none;
      appearance:none;
      border:0;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 18px;
      height:var(--btn-height);
      font-size:20px;
      font-weight:600;
      color:var(--primary-text);
      background:var(--primary-bg);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
      position:relative;
      overflow:hidden;
      user-select:none;
      touch-action:manipulation;
    }

    button.btn:active{ transform:translateY(1px) scale(.997); }
    button.btn:focus{ outline:3px solid rgba(0,0,0,0.08); outline-offset:2px; }
    .btn.ripple-effect span.ripple{
      position:absolute;
      border-radius:50%;
      transform:scale(0);
      animation:ripple .6s linear;
      background:rgba(255,255,255,0.35);
      pointer-events:none;
    }
    @keyframes ripple{ to{ transform:scale(8); opacity:0; } }

    /* Snooze button larger and green */
    #snoozeBtn{
      width:100%;
      height:calc(var(--btn-height) + 12vh);
      min-height:72px;
      max-height:160px;
      font-size:22px;
      background:var(--snooze-bg);
      color:var(--snooze-text);
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Secondary buttons grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:var(--gap);
    }

    .grid button{
      height: auto;
      min-height: var(--btn-height);
      font-size:18px;
      border-radius:12px;
      background:var(--primary-bg);
      color:var(--primary-text);
      margin-top: 20px;
      margin-bottom: 20px;
      flex-direction: column;
      padding: 10px 12px;
    }

    #stopBtn{
      width:100%;
      height:calc(var(--btn-height) + 12vh);
      min-height:72px;
      max-height:160px;
      font-size:22px;
      background:#dc3545;
      color:#ffffff;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #dismissBtn{
      background:#dc3545;
    }

    .target-time{
      display:block;
      font-size:16px;
      font-weight:700;
      color:rgba(255,255,255,0.80);
      margin-top:2px;
    }

    /* A little card to contain content so there's padding from edges */
    .panel{
      background:var(--card);
      padding:calc(var(--safe-padding));
      border-radius:20px;
      box-shadow:var(--shadow);
    }

    /* Toast */
    #toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:24px;
      background:rgba(0,0,0,0.8);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-size:14px;
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease, transform .25s ease;
      z-index:60;
    }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

    /* Landscape overlay */
    .landscape-overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      color:#fff;
      z-index:1000;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
    }
    .landscape-overlay .box{
      max-width:420px;
      background:rgba(255,255,255,0.04);
      padding:18px;
      border-radius:14px;
      backdrop-filter: blur(6px) saturate(120%);
    }

    @media (orientation: landscape){
      .landscape-overlay{ display:flex; }
    }

    /* Mobile tweaks */
    @media (max-width:420px){
      :root{ --safe-padding:12px; --btn-height:64px; }
      #snoozeBtn{ height:calc(var(--btn-height) + 16vh); font-size:20px; }
    }

  </style>
</head>
<body>
  <div class="app">
    <div class="shell">
      <main class="card panel" role="main">
        <header class="topbar">Appuyez pour snoozer</header>
        <section class="content">
          <div class="snooze-wrap">
            <button id="snoozeBtn" class="btn" aria-label="Snooze" data-action="snooze">Snooze</button>
          </div>

          <div class="grid">
            <button class="btn" data-action="report" data-time="30">30 min<span class="target-time"></span></button>
            <button class="btn" data-action="report" data-time="60">60 min<span class="target-time"></span></button>
            <button class="btn" data-action="report" data-time="90">1h 30min<span class="target-time"></span></button>
            <button class="btn" data-action="report" data-time="120">2h<span class="target-time"></span></button>
            <button class="btn" data-action="report" data-time="150">2h 30min<span class="target-time"></span></button>
            <button class="btn" id="dismissBtn" data-action="dismiss">Dismiss</button>
          </div>
        </section>
        <div id="debugConsole" role="log" aria-live="polite" aria-label="Debug log">
          <div class="debug-title">
            <span>Debug console</span>
            <span>enabled via debug=1</span>
          </div>
          <div class="debug-log"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    (function(){
      const toast = document.getElementById('toast');
      const debugConsole = document.getElementById('debugConsole');

      function getQueryParam(name){
        const params = new URLSearchParams(window.location.search);
        return params.get(name) ?? '';
      }

      const debugEnabled = getQueryParam('debug') === '1';
      const version=getQueryParam('ver');

      function formatTimestamp(){
        const now = new Date();
        return now.toISOString().replace('T', ' ').replace('Z', '');
      }

      function getCallerInfo(){
        const err = new Error();
        if(!err.stack) return 'unknown';
        const frames = err.stack.split('\n').slice(1).map(line => line.trim()).filter(Boolean);
        const caller = frames.find(line => !/logger\.|appendLog|getCallerInfo/.test(line)) || frames[0] || 'unknown';
        return caller.replace(/^at\s+/, '');
      }

      function appendLog(level, ...args){
        if(!debugEnabled || !debugConsole) return;
        const logRoot = debugConsole.querySelector('.debug-log');
        if(!logRoot) return;
        const message = args.map(arg => {
          if(typeof arg === 'string') return arg;
          try { return JSON.stringify(arg); } catch (e) { return String(arg); }
        }).join(' ');
        const entry = document.createElement('div');
        entry.className = 'debug-entry';
        entry.innerHTML =
          '<span class="timestamp">[' + formatTimestamp() + ']</span>' +
          '<span class="level ' + level + '">' + level + '</span>' +
          '<span class="caller">' + getCallerInfo() + '</span>' +
          '<span class="message">' + message + '</span>';
        logRoot.appendChild(entry);
        logRoot.scrollTop = logRoot.scrollHeight;
      }

      const logger = {
        debug: (...args) => appendLog('debug', ...args),
        info: (...args) => appendLog('info', ...args),
        warn: (...args) => appendLog('warn', ...args),
        error: (...args) => appendLog('error', ...args)
      };

      const Tasker = (() => {
        function getHostMethod(name){
          if(typeof tk !== 'undefined' && tk && typeof tk[name] === 'function'){
            return tk[name].bind(tk);
          }
          if(typeof window !== 'undefined' && window && typeof window[name] === 'function'){
            return window[name];
          }
          if(typeof self !== 'undefined' && self && typeof self[name] === 'function'){
            return self[name];
          }
          // Try accessing directly from global scope
          const global = (typeof globalThis !== 'undefined') ? globalThis : (typeof window !== 'undefined') ? window : (typeof self !== 'undefined') ? self : {};
          if(typeof global[name] === 'function'){
            return global[name];
          }
          return null;
        }

        function unavailable(name){
          const message = `Tasker API unavailable: ${name}`;
          logger.error(message);
          throw new Error(message);
        }

        return {
          performTask(taskName, priority, parameterOne, parameterTwo){
            const fn = getHostMethod('performTask');
            if(!fn) return unavailable('performTask');
            return fn(taskName, priority, parameterOne, parameterTwo);
          },
          setGlobal(varName, newValue){
            const fn = getHostMethod('setGlobal');
            if(!fn) return unavailable('setGlobal');
            return fn(varName, newValue);
          },
          flash(message){
            const fn = getHostMethod('flash');
            if(!fn) return unavailable('flash');
            return fn(message);
          }
        };
      })();

      function initDebugConsole(){
        if(!debugEnabled || !debugConsole) return;
        debugConsole.classList.add('active');
        logger.info('Debug mode enabled', window.location.href);
        logger.info('App version:', version);
      }

      function showToast(msg, ms=1600){
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(()=> toast.classList.remove('show'), ms);
        Tasker.flash(msg);
        logger.debug('showToast', msg);
      }

      function doVibrate(){
        if(navigator.vibrate) navigator.vibrate(40);
      }

      // Format target time as HH:MM
      function formatTargetTime(minutesAhead){
        const target = new Date(Date.now() + minutesAhead * 60000);
        const h = String(target.getHours()).padStart(2, '0');
        const m = String(target.getMinutes()).padStart(2, '0');
        return h + ':' + m;
      }

      // Populate target time spans on all report buttons
      function populateTargetTimes(){
        document.querySelectorAll('[data-action="report"]').forEach(btn => {
          const mins = parseInt(btn.getAttribute('data-time'), 10);
          const span = btn.querySelector('.target-time');
          if(span && !isNaN(mins)) span.textContent = formatTargetTime(mins);
        });
      }
      function setAlarmVariables(minutes, targetTime){
        logger.debug('Setting alarm variables:', {minutes, targetTime});
        Tasker.setGlobal('SnoozeAlarmMin', String(minutes));
        Tasker.setGlobal('SnoozeAlarmTime', targetTime);
        logger.debug('Alarm variables set');
      }

      function clearAlarmVariables(){
        logger.debug('Clearing alarm variables');
        Tasker.setGlobal('SnoozeAlarmMin', '');
        Tasker.setGlobal('SnoozeAlarmTime', '');
      }

      function triggerAlarmChanged(arg1, arg2){
        logger.debug('Triggering SnoozeAlarmChanged task with args:', arg1, arg2);
        const result = Tasker.performTask('SnoozeAlarmChanged', 0, '', '');
        logger.info('performTask result:', result);
      }

      // Get only the direct text content of a button (ignoring child spans)
      function getButtonLabel(el){
        let text = '';
        el.childNodes.forEach(n => { if(n.nodeType === 3) text += n.textContent; });
        return text.trim();
      }

      // Handler
      function onBtnClick(e){
        const el = e.currentTarget;
        const action = el.getAttribute('data-action') || el.textContent.trim();
        doVibrate();

        if(action === 'report'){
          const mins = parseInt(el.getAttribute('data-time'), 10);
          const target = formatTargetTime(mins);
          const span = el.querySelector('.target-time');
          // if(span) span.textContent = target;
          logger.debug('button clicked: report, target:', target);
          setAlarmVariables(mins, target);
          triggerAlarmChanged('report');
        } else {
          if(action === 'snooze' || action === 'dismiss'){
            logger.debug('button clicked: ', action);
            triggerAlarmChanged(action);
          }
        }
      }

      // Attach handlers
      function attach(){
        const snooze = document.getElementById('snoozeBtn');
        if(snooze) snooze.addEventListener('click', onBtnClick, {passive:false});
        const others = document.querySelectorAll('.grid .btn');
        others.forEach(b => b.addEventListener('click', onBtnClick, {passive:false}));
      }

      function onStopClick(){
        doVibrate();
        triggerAlarmChanged('stop');
        showToast('Arrêté');
        logger.debug('button clicked: stop');
      }

      function initSecondAlarmMode(){
        const topbar = document.querySelector('.topbar');
        if(topbar) topbar.textContent = 'Appuyez pour arrêter';

        const grid = document.querySelector('.grid');
        if(grid) grid.remove();

        const wrap = document.querySelector('.snooze-wrap');
        if(wrap){
          wrap.innerHTML = '';
          const stopBtn = document.createElement('button');
          stopBtn.id = 'stopBtn';
          stopBtn.className = 'btn';
          stopBtn.type = 'button';
          stopBtn.textContent = 'Arrêter';
          stopBtn.addEventListener('click', onStopClick, {passive:false});
          wrap.appendChild(stopBtn);
        }
      }

      const mode = getQueryParam('mode').trim().toLowerCase();
      if(mode === 'secondalarm'){
        initSecondAlarmMode();
      }

      initDebugConsole();
      attach();
      populateTargetTimes();

      // Accessibility: allow keyboard activation
      document.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter' || e.key === ' '){
          const active = document.activeElement;
          if(active && active.classList && active.classList.contains('btn')){
            active.click();
            e.preventDefault();
          }
        }
      });

    })();
  </script>
</body>
</html>
